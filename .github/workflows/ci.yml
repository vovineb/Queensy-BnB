name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: queensy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/queensy_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/queensy_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/queensy_e2e
      APP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-00
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Prepare e2e database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE queensy_e2e"
          DATABASE_URL=$E2E_DATABASE_URL npx prisma migrate deploy
          DATABASE_URL=$E2E_DATABASE_URL SEED_ADMIN_EMAIL=admin@e2e.test SEED_ADMIN_PASSWORD=admin-e2e-password npm run db:seed
      - run: npx next build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
